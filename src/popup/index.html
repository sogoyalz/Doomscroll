<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Doomscroll</title>
  </head>
  <body>
    <!--
      The fallback inside #root is deliberate. React replaces it the moment it
      mounts, so it is never seen in a real build — but if this file is loaded
      directly as an unpacked extension, main.tsx cannot execute and the popup
      would otherwise be a blank white box with no explanation.
    -->
    <div id="root">
      <div
        style="
          width: 320px;
          padding: 16px;
          font:
            13px/1.5 system-ui,
            sans-serif;
          color: #333;
        "
      >
        <strong style="display: block; margin-bottom: 6px">Doomscroll could not open</strong>
        Reload Doomscroll in <code>chrome://extensions</code> and reopen the popup.
        If you installed a development build, check that you selected the built dist folder.
        <div>Removing the extension deletes its local history.</div>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
