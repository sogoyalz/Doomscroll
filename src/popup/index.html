<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Doomscroll</title>
  </head>
  <body>
    <!--
      The fallback inside #root is deliberate. React replaces it the moment it
      mounts, so it is never seen in a real build — but if this file is loaded
      directly as an unpacked extension, main.tsx cannot execute and the popup
      would otherwise be a blank white box with no explanation.
    -->
    <div id="root">
      <div
        style="
          width: 320px;
          padding: 16px;
          font: 13px/1.5 system-ui, sans-serif;
          color: #333;
        "
      >
        <strong style="display: block; margin-bottom: 6px">Wrong folder loaded</strong>
        This is the build's source file, not the built extension. In
        <code>chrome://extensions</code>, remove Doomscroll and Load unpacked again,
        selecting the <strong>dist</strong> folder inside the project — not the project
        folder itself.
        <div style="margin-top: 8px; color: #777">
          Run <code>npm run build</code> first if <code>dist</code> does not exist.
        </div>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
