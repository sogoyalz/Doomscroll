name: CI

# Every branch, not just main. Feature work is exactly where a regression
# should be caught, and a filter on main means long-lived branches accumulate
# unverified commits and only fail at merge time.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Also exercises the packaging checks: icons present, both content
      # scripts emitted, the MAIN-world script still registered.
      - run: npm run package:verify
      - run: npm run test:browser

  audit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Both shipping code and the tools used to build and test it.
      - run: npm audit --audit-level=moderate
